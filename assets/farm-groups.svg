<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="t d"><title id="t">Split whole farms, then keep their records together</title><desc id="d">The training side contains farm A rounds one and two, and farm B rounds one and two. The test side contains farm C rounds one and two.</desc><rect width="1000" height="350" rx="16" fill="#f4f7f5"/><g font-family="Arial,sans-serif" fill="#173a35"><text x="30" y="42" font-size="25" font-weight="bold">Split farms first. Keep their records together.</text><rect x="25" y="66" width="600" height="247" rx="12" fill="#e0eee9"/><rect x="648" y="66" width="326" height="247" rx="12" fill="#fff0d9"/><text x="48" y="105" font-size="23" font-weight="bold">TRAIN — learn the mean</text><text x="670" y="105" font-size="23" font-weight="bold">TEST — evaluate it</text><g fill="white" stroke="#9ab9ac"><rect x="48" y="125" width="260" height="157" rx="10"/><rect x="330" y="125" width="270" height="157" rx="10"/><rect x="670" y="125" width="282" height="157" rx="10"/></g><text x="72" y="161" font-size="22" font-weight="bold">Farm A</text><text x="354" y="161" font-size="22" font-weight="bold">Farm B</text><text x="694" y="161" font-size="22" font-weight="bold">Farm C</text><g font-size="21"><text x="72" y="207">Round 1 · A/1</text><text x="72" y="246">Round 2 · A/2</text><text x="354" y="207">Round 1 · B/1</text><text x="354" y="246">Round 2 · B/2</text><text x="694" y="207">Round 1 · C/1</text><text x="694" y="246">Round 2 · C/2</text></g><text x="30" y="337" font-size="16" fill="#52675f">Invented three-farm illustration · no farm appears on both sides</text></g></svg>
